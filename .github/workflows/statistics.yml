name: Distribution statistics

on:
  schedule:
    # Later runs recover temporary failures; successful PyPI results stay cached daily.
    - cron: '23 7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: distribution-statistics
          path: statistics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Snapshot public GitHub counters and all registered PyPI packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python source/.github/scripts/package_stats.py --registry source/.github/package-registry.json --output statistics
      - name: Retain the observation history
        working-directory: statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- README.md latest.json observations packages
          git commit -m 'Record distribution statistics'
          git push origin HEAD:distribution-statistics
